<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to your MDCATEMY camp." />
    <title>Login | MDCATEMY</title>
    <link rel="preload" href="assets/fonts/rubik-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="auth.css?v=20260810-2" />
  </head>
  <body class="auth-page auth-login-page">
    <div class="auth-doodles" aria-hidden="true">
      <img src="assets/doodles/atom.webp" alt="" />
      <img src="assets/doodles/flask-conical.webp" alt="" />
      <img src="assets/doodles/dna.webp" alt="" />
      <img src="assets/doodles/microscope.webp" alt="" />
      <img src="assets/doodles/orbit.webp" alt="" />
      <img src="assets/doodles/brain.webp" alt="" />
    </div>
    <div class="auth-glare" aria-hidden="true"></div>

    <main class="auth-login-shell">
      <a class="auth-brand" href="index.html" aria-label="MDCATEMY home">
        <img src="assets/MDCATEMY-logo.webp" alt="MDCATEMY" />
      </a>
      <p class="auth-tagline">Where doctors are forged.</p>

      <section class="auth-card" aria-labelledby="login-title">
        <h1 id="login-title">Welcome Back Warrior</h1>
        <p class="auth-card-intro">Your tribe is waiting. Let&apos;s train.</p>

        <form class="auth-form" data-login-form>
          <div class="auth-field">
            <label for="email">Email address</label>
            <div class="auth-field-control">
              <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
            </div>
          </div>

          <div class="auth-field">
            <label for="password">Password</label>
            <div class="auth-field-control">
              <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required />
              <button class="auth-password-toggle" type="button" data-password-toggle aria-label="Show password" aria-pressed="false">
                <svg class="password-show-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="password-hide-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 6.2A11.7 11.7 0 0 1 12 6c6.5 0 10 6 10 6s-.7 1.3-2.1 2.8M6.5 6.5C3.5 8.3 2 12 2 12s3.5 6 10 6a10.7 10.7 0 0 0 4.1-.8M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
              </button>
            </div>
          </div>

          <button class="auth-submit" type="submit" data-login-submit>
            Login to my camp
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
          </button>
          <output class="auth-status" data-login-status hidden aria-live="polite"></output>
        </form>

        <p class="auth-links">
          <a href="https://www.mdcatemy.com/forgot-password">Forgot password?</a>
          <a href="https://wa.me/923058697159" target="_blank" rel="noreferrer">Contact support</a>
        </p>
      </section>
    </main>

    <script src="login.js?v=20260810-2"></script>
  </body>
</html>
