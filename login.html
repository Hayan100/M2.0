<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to your MDCATEMY camp." />
    <title>Login | MDCATEMY</title>
    <link rel="preload" href="assets/fonts/rubik-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" />
    <link rel="stylesheet" href="auth.css?v=20260810-6" />
  </head>
  <body class="auth-page auth-login-page antialiased">
    <div class="auth-doodles" aria-hidden="true">
      <img class="doodle-atom" src="assets/doodles/atom.webp" alt="" />
      <img class="doodle-flask" src="assets/doodles/flask-conical.webp" alt="" />
      <img class="doodle-dna" src="assets/doodles/dna.webp" alt="" />
      <img class="doodle-microscope" src="assets/doodles/microscope.webp" alt="" />
      <img class="doodle-orbit" src="assets/doodles/orbit.webp" alt="" />
      <img class="doodle-brain" src="assets/doodles/brain.webp" alt="" />
      <img class="doodle-heart" src="assets/doodles/heart-pulse.webp" alt="" />
      <img class="doodle-telescope" src="assets/doodles/telescope.webp" alt="" />
    </div>
    <div class="auth-glare" aria-hidden="true"></div>

    <main class="auth-login-shell">
      <a class="auth-brand" href="index.html" aria-label="MDCATEMY home">
        <img src="assets/MDCATEMY-logo.webp" alt="MDCATEMY" />
      </a>
      <p class="auth-tagline">Where doctors are forged.</p>

      <section class="auth-card" aria-labelledby="login-title">
        <h1 id="login-title">Welcome Back Warrior</h1>
        <p class="auth-card-intro">Your tribe is waiting. Let&apos;s train.</p>

        <div class="auth-form" role="group" aria-label="Login details">
          <div class="auth-field">
            <label for="email">Email address</label>
            <div class="auth-field-control">
              <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
            </div>
          </div>

          <div class="auth-field">
            <label for="password">Password</label>
            <div class="auth-field-control">
              <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required />
            </div>
          </div>

          <button class="auth-submit" type="button">
            Login to my camp
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
          </button>
        </div>

        <p class="auth-links">
          Forgot password? <a href="https://wa.me/923058697159" target="_blank" rel="noreferrer">Contact support</a>
        </p>
      </section>
    </main>
  </body>
</html>
